<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finishing sign-in - Benja’s Tracker</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#5f6368;--accent:#4f46e5;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececf0;--muted:#a0a0aa;--accent:#8b87ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:34rem;margin:0 auto;padding:6rem 1.25rem;text-align:center}
a{color:var(--accent)}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Finishing sign-in…</h1>
<p class="muted">Taking you back to Benja’s Tracker. If nothing happens, <a id="manual" href="#">press here</a>.</p>
</main>
<script>
// Roblox sends people here; this page only passes the login result on to the app's server.
var WORKER = "https://benjastracker.wetwetwqhgyrtqrhwetwew.workers.dev";
var from = new URLSearchParams(location.search);
var to = new URLSearchParams();
["code", "state", "error", "error_description"].forEach(function (k) {
  if (from.get(k)) to.set(k, from.get(k));
});
var target = WORKER + "/?" + to.toString();
document.getElementById("manual").href = target;
location.replace(target);
</script>
<noscript>
<p style="text-align:center">JavaScript is needed to finish signing in.</p>
</noscript>
</body>
</html>
